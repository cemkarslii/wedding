<!-- ▸ Photo Sharing -->
<section class="section section--cream">
  <div class="reveal">
    <span class="section__label">Anılar</span>
    <h2 class="section__title">Fotoğraflarınızı Paylaşın</h2>
    <p class="section__desc">Düğünümüzden çektiğiniz fotoğrafları bizimle paylaşın, birlikte güzel anılar biriktirelim.</p>
  </div>
  <div class="photos__upload-area reveal reveal-delay-1" id="photoUploadArea">
    <svg class="photos__upload-icon" viewBox="0 0 52 52" id="share-photo">
      <rect x="4" y="10" width="44" height="34" rx="4" />
      <circle cx="20" cy="24" r="5" />
      <path d="M4 36l12-10 8 6 12-10 12 10" />
      <path d="M26 4v12M20 10l6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <p class="photos__upload-text">
      <strong>Dokunarak seçin</strong> veya sürükleyip bırakın
    </p>
    <span class="photos__upload-hint">JPG, PNG • Maks 10MB</span>
    <input type="file" id="photoInput" multiple accept="image/*" />
  </div>
  <div class="photos__preview" id="photoPreview"></div>
  <button class="photos__share-btn" id="photoShareBtn">
    <svg viewBox="0 0 24 24">
      <path d="M22 2L11 13" />
      <path d="M22 2L15 22l-4-9-9-4z" />
    </svg>Fotoğrafları Gönder
  </button>
</section>
