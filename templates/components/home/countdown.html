<!-- ▸ Countdown -->
<section class="section section--dark">
  <div class="reveal">
    <span class="section__label">Geri Sayım</span>
    <h2 class="section__title">Büyük Güne</h2>
  </div>
  <div class="countdown reveal reveal-delay-1" id="countdown">
    <div class="countdown__item">
      <span class="countdown__number" id="cdDays">--</span>
      <span class="countdown__label">Gün</span>
    </div>
    <span class="countdown__separator">:</span>
    <div class="countdown__item">
      <span class="countdown__number" id="cdHours">--</span>
      <span class="countdown__label">Saat</span>
    </div>
    <span class="countdown__separator">:</span>
    <div class="countdown__item">
      <span class="countdown__number" id="cdMins">--</span>
      <span class="countdown__label">Dakika</span>
    </div>
    <span class="countdown__separator">:</span>
    <div class="countdown__item">
      <span class="countdown__number" id="cdSecs">--</span>
      <span class="countdown__label">Saniye</span>
    </div>
  </div>
</section>
